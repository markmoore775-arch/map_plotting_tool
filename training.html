<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Training | AirPlan</title>
    <link rel="icon" href="assets/airplan-icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.training-menu .fp-welcome-bar {
            z-index: 10001;
        }
        .intro-training-quip {
            font-size: 0.95rem;
            line-height: 1.5;
            font-style: italic;
            color: rgba(255, 255, 255, 0.82);
            margin: -16px 0 28px;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body class="training-menu">
    <nav class="fp-welcome-bar" aria-label="AirPlan home">
        <a href="index.html" class="fp-welcome-home-link" title="Return to AirPlan welcome screen" aria-label="AirPlan home, return to welcome screen">
            <img src="assets/airplanlogowhite.png" alt="" class="ap-brand-logo fp-welcome-logo" />
            <span class="fp-welcome-title">AirPlan</span>
        </a>
    </nav>

    <div class="intro-overlay splash-done">
        <div class="intro-content">
            <div class="intro-logo-wrap">
                <img src="assets/airplanlogowhite.png" alt="AirPlan" class="ap-brand-logo intro-logo">
            </div>
            <p class="intro-tagline">Training</p>
            <p class="intro-description">
                Practice with two arcade-style games: vertical flight in Drone Run, or side-scrolling survival in Drone Dash.
            </p>
            <p class="intro-training-quip">The CAA does not recognise your high score.</p>
            <div class="intro-cta-stack">
                <a href="drone-run/" class="intro-cta intro-cta-secondary">
                    Drone Run
                </a>
                <a href="drone-dash/" class="intro-cta intro-cta-secondary">
                    Drone Dash
                </a>
            </div>
            <p class="intro-disclaimer" role="note">
                For training and entertainment. Does not add to flight hours or currency.
            </p>
            <p class="intro-privacy"><a href="privacy.html">Privacy Policy</a></p>
        </div>
    </div>
    <script src="js/ap-brand-logo.js?v=1"></script>
</body>
</html>
