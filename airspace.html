<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Airspace | AirPlot</title>
    <link rel="icon" href="assets/airplot-icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/airspace.css?v=27">
</head>
<body class="airspace-mode ap-shell">
    <script>
        try { if (localStorage.getItem('fnLightTheme') === '1') document.body.classList.add('fn-light-theme'); } catch (e) {}
    </script>
    <div id="map"></div>

    <header class="fn-top-bar" id="mapTopChrome">
        <div class="fn-top-bar-start">
            <nav class="fp-welcome-bar" aria-label="AirPlot home">
                <a href="index.html" class="fp-welcome-home-link" title="Return to AirPlot welcome screen" aria-label="AirPlot home, return to welcome screen">
                    <img src="assets/airplot-icon.svg" alt="" width="20" height="20" class="fp-welcome-logo" />
                    <span class="fp-welcome-title">AirPlot</span>
                </a>
            </nav>
            <nav class="ap-tool-nav" aria-label="AirPlot tools">
                <a href="index.html?autostart=1" class="ap-tool-nav__link" title="Planning map" aria-label="Planner"><span class="ap-tool-nav__icon ap-tool-nav__icon--planner" aria-hidden="true"></span><span class="ap-tool-nav__label">Planner</span></a>
                <a href="weather.html" class="ap-tool-nav__link" title="Flight weather" aria-label="Weather"><span class="ap-tool-nav__icon ap-tool-nav__icon--weather" aria-hidden="true"></span><span class="ap-tool-nav__label">Weather</span></a>
                <span class="ap-tool-nav__link ap-tool-nav__link--current" aria-current="page" aria-label="Airspace, current page"><span class="ap-tool-nav__icon ap-tool-nav__icon--airspace" aria-hidden="true"></span><span class="ap-tool-nav__label">Airspace</span></span>
                <a href="checklist.html" class="ap-tool-nav__link" title="M4T / TD checklist" aria-label="Checklist"><span class="ap-tool-nav__icon ap-tool-nav__icon--checklist" aria-hidden="true"></span><span class="ap-tool-nav__label">Checklist</span></a>
                <a href="flight-notes.html" class="ap-tool-nav__link" title="Flight report" aria-label="Flight Report"><span class="ap-tool-nav__icon ap-tool-nav__icon--flight-report" aria-hidden="true"></span><span class="ap-tool-nav__label"><span class="ap-tool-nav__label--long">Flight </span>Report</span></a>
            </nav>
        </div>
        <div class="fn-top-bar-actions">
            <button type="button" class="fn-theme-toggle" id="fnThemeToggle" aria-pressed="false" aria-label="Switch to light theme" title="Switch to light theme">
                <span class="fn-theme-toggle-icon fn-theme-toggle-icon--moon fn-theme-toggle-icon--svg" aria-hidden="true"></span>
                <span class="fn-theme-toggle-icon fn-theme-toggle-icon--sun fn-theme-toggle-icon--svg hidden" aria-hidden="true"></span>
            </button>
        </div>
    </header>

    <div class="airspace-side-toolbar" id="airspaceHelpPanelWrap">
        <div class="airspace-side-panel" id="airspaceHelpPanel">
            <div class="airspace-side-panel-header">
                <span>Instructions</span>
                <button type="button" class="airspace-side-panel-close" id="airspaceHelpClose" aria-label="Close">&times;</button>
            </div>
            <div class="airspace-side-panel-body" id="airspaceHelpBody"></div>
        </div>
    </div>

    <div class="airspace-toolbar" role="toolbar" aria-label="Airspace traffic">
        <div class="airspace-toolbar-inner">
            <div class="airspace-toolbar-controls">
                <div class="airspace-toolbar-group">
                    <label class="airspace-toolbar-label" for="airspaceTrafficToggle">
                        <input type="checkbox" id="airspaceTrafficToggle" checked />
                        Show traffic
                    </label>
                </div>
                <div class="airspace-toolbar-group">
                    <label class="airspace-toolbar-label" for="airspaceOgnToggle">
                        <input type="checkbox" id="airspaceOgnToggle" />
                        OGN (FLARM-class)
                    </label>
                </div>
                <div class="airspace-toolbar-group" id="airspaceAglWrap">
                    <label class="airspace-toolbar-label" for="airspaceAglToggle">
                        <input type="checkbox" id="airspaceAglToggle" />
                        Approx. AGL
                    </label>
                    <span class="airspace-toolbar-hint" id="airspaceAglHint" title="Uses Mapbox terrain vs baro/geom altitude from js/config.js"
                        >needs Mapbox token</span>
                </div>
                <div class="airspace-toolbar-group">
                    <button type="button" class="airspace-btn" id="airspaceRefreshBtn" title="Fetch traffic for the current map view">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                        Refresh
                    </button>
                </div>
                <div class="airspace-toolbar-group">
                    <a href="airspace-adsbx.html" class="airspace-btn airspace-view-switch" title="Switch to ADS-B Exchange embedded map" aria-label="Switch to ADS-B Exchange view">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
                        <span class="airspace-view-switch-text">ADS-B Exchange</span>
                    </a>
                </div>
            </div>
            <div class="airspace-toolbar-status" id="airspaceStatus" aria-live="polite"></div>
        </div>
    </div>

    <p class="airspace-attribution">
        Traffic: <a href="https://api.adsb.lol/docs" target="_blank" rel="noopener">ADSB.lol</a>
        (<a href="https://adsb.lol/" target="_blank" rel="noopener">adsb.lol</a>; coverage varies).
        Optional <a href="https://www.glidernet.org/" target="_blank" rel="noopener">Open Glider Network</a> (gliders / FLARM-class; coverage varies).
        Optional AGL: Mapbox Terrain-RGB. Map: layer attribution in the map control.
    </p>

    <div class="airspace-logo" aria-hidden="true">
        <img src="assets/airplot-icon.svg" alt="">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js" charset="utf-8"></script>
    <script src="js/geolocation-helpers.js?v=6"></script>

    <script src="js/ap-shell-theme.js?v=1"></script>
    <script src="js/config.js"></script>
    <script src="js/elevation.js"></script>
    <script src="js/airspace.js?v=28"></script>
</body>
</html>
